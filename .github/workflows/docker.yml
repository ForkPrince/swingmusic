name: Build Docker

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout webclient
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/webclient
          path: webclient
        continue-on-error: true

      - name: Detect webclient source
        id: webclient
        run: |
          if [ -d "webclient/src" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=webclient" >> $GITHUB_OUTPUT
          elif [ -d "../webclient/src" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "path=../webclient" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract version
        id: version
        run: |
          if [ -f backend/version.txt ]; then
            echo "version=$(cat backend/version.txt | tr -d '[:space:]')" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.webclient.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: ${{ steps.webclient.outputs.path }}/yarn.lock

      - name: Build custom UI
        if: steps.webclient.outputs.found == 'true'
        run: |
          cd ${{ steps.webclient.outputs.path }}
          yarn install --frozen-lockfile
          yarn build
          mkdir -p /tmp/client
          cp -r dist/* /tmp/client/
          echo "${{ steps.version.outputs.version }}" > /tmp/client/version.txt
          cat /tmp/client/version.txt
          cd /tmp
          zip -r $GITHUB_WORKSPACE/backend/src/swingmusic/client.zip client
          ls -lh $GITHUB_WORKSPACE/backend/src/swingmusic/client.zip
          unzip -l $GITHUB_WORKSPACE/backend/src/swingmusic/client.zip | head -n 20

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Name
        id: lowercase
        run: echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repo }}:latest
          build-args: app_version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
